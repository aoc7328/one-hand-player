name: iOS Build

# 在雲端 macOS runner 上驗證程式碼能否成功編譯。
# （沒有 Mac 也能靠這個確認每次改動沒把專案弄壞。）
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator, unsigned)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen
          gem install cocoapods --no-document || sudo gem install cocoapods --no-document

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install Pods
        run: pod install --repo-update

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -workspace OneHandPlayer.xcworkspace \
            -scheme OneHandPlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
